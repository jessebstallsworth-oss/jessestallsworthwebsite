teaching:()=>`<h2>Teaching and Training Philosophy</h2><div class="teaching-philosophy"><p>My teaching philosophy centers on inclusive, practical learning that helps students navigate new academic environments with confidence. I connect foundational skills—time management, academic expectations, digital literacy, and stress management—with dialogue, active participation, and mentorship. As Lead Instructor for UK 101 and Co-Instructor for NUR 101, I have worked with first-year and pre-nursing students to build the habits and self-awareness they need for academic success, while also helping them explore nursing as a profession. I co-instructed and designed NUR 520: Fundamentals of Online Teaching, where I modeled the same engaging, learner-centered approach I hope future educators will carry into their own classrooms. Whether teaching in person or online, I strive to create an inclusive environment where students feel comfortable asking questions, taking risks, and connecting course content to their larger goals.</p><p>I bring that same philosophy to faculty, staff, and client training, where I prioritize practical, immediately applicable learning. As Director of Instructional Design, I developed training materials and led workshops for faculty on educational technology, application best practices, and AI-powered tools. I designed and delivered Lunch &amp; Learn sessions on Canvas New Quizzes, Google Workspace for Education, YuJa Media Basics, and Flipgrid, and presented on Quality Matters rubrics and course improvement. Through my independent consulting since 2012, I have served as a Moodle administrator, designed graduate and undergraduate courses, conducted needs assessments, and provided instructional technology support tailored to client goals. These experiences have taught me that effective training—whether for students, faculty, or clients—must be accessible, hands-on, and grounded in ongoing mentorship, so learners can confidently apply new skills in their own contexts.</p></div><h2>Teaching Experience</h2><div class="teaching-cards">${TEACHING_ROLES.map(x=>`<article class="teaching-card"><h3><b>${E(x.r)}</b></h3><p>${E(x.d)} · ${E(x.o)}</p></article>`).join("")}</div><h2>Academic Engagement</h2><div class="course-table-wrap" role="region" aria-label="Academic engagement course table" tabindex="0"><table class="course-table"><thead><tr><th>Year</th><th>Term</th><th>Course</th><th>Teaching Role</th><th>Credit Hours</th><th>Students</th></tr></thead><tbody>${TEACHING_COURSES.map(x=>`<tr><td>${x.y}</td><td>${x.s}</td><td>${x.c}</td><td>${x.r}</td><td>${x.h}</td><td>${x.n}</td></tr>`).join("")}</tbody></table></div>`,
