<!DOCTYPE html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover"><title>Jesse B. Stallsworth, MS, QMPR-C, CPER</title>
<style>
:root{--bg:#f3f1ea;--fg:#1a1a18;--m:#6a6a62;--l:#dedbd0;--c:#fff;--a:#4a6741;--t:#e7ecdc;box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media(prefers-color-scheme:dark){:root:not([data-theme=light]){--bg:#101210;--fg:#f1f0ea;--m:#a3a69b;--l:#262a23;--c:#181b17;--a:#9fb86a;--t:#1f2a18}}
:root[data-theme=dark]{--bg:#101210;--fg:#f1f0ea;--m:#a3a69b;--l:#262a23;--c:#181b17;--a:#9fb86a;--t:#1f2a18}
html{scroll-padding-top:env(safe-area-inset-top,0px)}*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--fg);font:16px/1.65 Inter,system-ui,-apple-system,"Segoe UI",sans-serif}
a{color:inherit}.w{max-width:1040px;margin:0 auto;padding:0 24px}
nav{position:sticky;top:env(safe-area-inset-top,0px);background:var(--bg);border-bottom:1px solid var(--l);z-index:5}
nav .w{display:flex;align-items:center;justify-content:space-between;gap:12px;min-height:60px;flex-wrap:wrap}
nav b{letter-spacing:.02em}nav div{display:flex;gap:4px;flex-wrap:wrap;align-items:center}
nav a{text-decoration:none;color:var(--m);padding:6px 12px;border-radius:99px;font-size:14px}nav a.on,nav a:hover{color:var(--a);background:var(--t)}
button{font:inherit;cursor:pointer}.btn,.x{border:1px solid var(--a);background:var(--a);color:var(--bg);padding:10px 20px;border-radius:99px;text-decoration:none;font-size:14px;display:inline-block}
.btn.o,.x{background:none;color:var(--fg);border-color:var(--l)}.x{padding:3px 10px;font-size:12px;margin-top:8px}
.hero{display:grid;grid-template-columns:1.2fr .8fr;gap:48px;align-items:center;padding:56px 40px;margin-top:24px;background:linear-gradient(135deg,var(--t),transparent 75%);border-radius:24px}
.eyebrow{text-transform:uppercase;letter-spacing:.14em;font-size:12px;font-weight:600;color:var(--a)}
h1{font:600 clamp(32px,5vw,52px)/1.1 Georgia,"Times New Roman",serif;margin:12px 0 18px;letter-spacing:-.01em}
h2{font:600 28px/1.2 Georgia,serif;margin:56px 0 20px;border-left:4px solid var(--a);padding-left:14px}h3{margin:0;font-size:18px}.m{color:var(--m)}
.hero img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:60% 30%;border-radius:20px;box-shadow:0 12px 40px #0003}
.stats{display:grid;grid-template-columns:repeat(auto-fit,minmax(150px,1fr));gap:16px;margin:24px 0}
.stats div,.card{background:var(--c);border:1px solid var(--l);border-radius:16px;padding:20px}.stats b{font:600 32px Georgia,serif;display:block;color:var(--a)}
.card{border-top:3px solid var(--a);transition:transform .2s,box-shadow .2s}.card:hover{transform:translateY(-3px);box-shadow:0 10px 28px #0002}
.band{height:96px;border-radius:12px;background:linear-gradient(135deg,var(--a),#1f2d1a);display:flex;align-items:center;justify-content:center;font-size:40px;color:#fff;margin:2px 0 14px}
.metric{font:600 42px/1 Georgia,serif;color:var(--a);margin-bottom:8px}.badge{background:var(--t);color:var(--a);border-radius:99px;padding:0 10px;font-size:13px;font-weight:600}
details.card summary{cursor:pointer;font-weight:600;display:flex;justify-content:space-between;align-items:center;gap:8px}details.card ul{font-size:14px}.grid{display:grid;grid-template-columns:repeat(auto-fill,minmax(290px,1fr));gap:16px}
.row{display:grid;grid-template-columns:170px 1fr;gap:24px;padding:24px 0;border-top:1px solid var(--l)}.when{color:var(--m);font-size:14px}
ul{padding-left:18px;margin:10px 0 0}li{margin:5px 0}.chips>span{display:inline-block;border:1px solid var(--a);background:var(--t);border-radius:99px;padding:4px 14px;margin:0 6px 8px 0;font-size:14px}
blockquote{margin:0;font:italic 19px/1.5 Georgia,serif}form{display:grid;gap:12px;max-width:520px}
input,textarea{font:inherit;padding:12px;border:1px solid var(--l);border-radius:10px;background:var(--bg);color:var(--fg);width:100%}
footer{border-top:1px solid var(--l);margin-top:72px;padding:28px 0;color:var(--m);font-size:14px}
#tb{position:fixed;right:16px;bottom:calc(16px + env(safe-area-inset-bottom,0px));display:flex;gap:8px;z-index:9}
#dlg{position:fixed;inset:0;background:#000a;display:none;z-index:10;align-items:center;justify-content:center;padding:20px}#dlg.s{display:flex}
#dlg>div{background:var(--bg);border-radius:16px;padding:20px;width:min(680px,100%)}#dlg textarea{height:300px;font:12px monospace}
.ed [data-p]{outline:1px dashed var(--m);outline-offset:2px;cursor:text}.ed [data-p]:empty:before{content:"(empty)";color:var(--m)}
@media(max-width:760px){.hero,.row{grid-template-columns:1fr;gap:12px}.hero{padding:28px 20px}}

nav{background:#121411;border-bottom:1px solid #262a23}nav b{color:#f4f4f5}nav a{color:#a1a1aa}
nav a.on,nav a:hover{background:#262a23;color:#fff}nav a.on{box-shadow:inset 0 -2px 0 #a3b86c}
.pill{display:inline-block;margin:14px 0 0;padding:4px 14px;border-radius:99px;font-size:13px;font-weight:600}
.hx{background:#121411;color:#f4f4f5;padding:72px 0 88px}.hg{display:grid;grid-template-columns:1.15fr .85fr;gap:64px;align-items:center}
.hx .eyebrow{color:#a3b86c}.hx .pill{background:#232b1b;color:#a3b86c}
.hx h1{font-size:clamp(28px,4.2vw,50px);line-height:1.1;letter-spacing:-.02em;color:#fff;margin:18px 0 22px}
.lead{font-size:18px;color:#c4c4cc;max-width:560px}
.hx .btn{background:#a3b86c;border-color:#a3b86c;color:#18181b;padding:14px 28px;font-weight:600}.hx .btn.o{background:none;color:#f4f4f5;border-color:#52525b}
.ph img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:60% 30%;border-radius:24px;box-shadow:16px 16px 0 #a3b86c}
.sb{background:var(--a);color:var(--bg)}.sg{display:grid;grid-template-columns:repeat(auto-fit,minmax(170px,1fr));gap:24px;padding:48px 24px}
.sg b{font:600 clamp(40px,6vw,64px)/1 Georgia,serif;display:block}.sg span{opacity:.9}
@media(max-width:760px){.hg{grid-template-columns:1fr;gap:40px}.hx{padding:40px 0 56px}.ph img{aspect-ratio:1}}
.values{display:grid;grid-template-columns:repeat(auto-fit,minmax(220px,1fr));gap:16px;margin:0 0 12px}.value{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:20px}.value h3{color:var(--a);margin-bottom:8px}.value p{margin:0;color:var(--m)}.values-extra{margin:0 0 12px;padding-left:24px}.values-extra li{margin:6px 0}

nav .w{max-width:1240px;min-height:88px}
#nv{flex-wrap:nowrap;overflow-x:auto;scrollbar-width:none}#nv::-webkit-scrollbar{display:none}
nav b{font-size:20px}
nav a{white-space:nowrap;padding:12px 15px;font-size:18px;font-weight:600;color:#fff;border-radius:8px}
nav a.on{box-shadow:inset 0 -2px 0 #a3b86c}
.ph{position:relative}.ph img{position:relative;z-index:1}
.ph:before{content:"";position:absolute;top:-28px;right:-28px;width:96px;height:96px;border-radius:50%;background:#4a6741}
@media(max-width:900px){#nv{width:100%;padding-bottom:6px}}

.pg{display:grid;grid-template-columns:repeat(auto-fill,minmax(320px,1fr));gap:14px}
.pc{display:flex;gap:16px;background:var(--c);border:1px solid var(--l);border-radius:14px;padding:20px}
.pc h3{font-size:17px}.pc .m{margin:6px 0 10px;font-size:15px}.pc a{color:var(--a);font-weight:600;font-size:14px;text-decoration:none}
.ic{flex:none;width:44px;height:44px;border-radius:12px;background:var(--t);color:var(--a);display:flex;align-items:center;justify-content:center;font-size:20px}
.al details{border-top:1px solid var(--l)}.al details:last-child{border-bottom:1px solid var(--l)}
.al summary{cursor:pointer;display:flex;align-items:center;gap:10px;padding:16px 4px;font-weight:600;list-style:none}
.al summary::-webkit-details-marker{display:none}.al summary span:first-child{flex:1}
.al summary:after{content:"+";color:var(--a);font-size:20px}.al details[open] summary:after{content:"−"}
.al ul{padding:0 4px 16px 22px;font-size:14px}
.up,.al{text-transform:capitalize}.al ul{font-size:14px}
.tl{list-style:none;margin:0;padding:0 0 0 26px;border-left:2px solid var(--l)}
.tl li{position:relative;padding:0 0 30px}
.tl .dot{position:absolute;left:-34px;top:6px;width:14px;height:14px;border-radius:50%;background:var(--a);border:3px solid var(--bg);box-shadow:0 0 0 2px var(--a)}
.tl li.edu .dot{background:var(--bg)}
.tl .tm{font-size:13px;color:var(--a);font-weight:600;letter-spacing:.04em}.tl h3{margin:2px 0}
.tl a{font-size:14px;color:var(--a);font-weight:600;text-decoration:none}
.xc{background:var(--c);border:1px solid var(--l);border-radius:14px;padding:18px 22px;margin:0 0 12px;scroll-margin-top:90px}
.xc>summary,.xh{display:flex;justify-content:space-between;gap:16px;align-items:flex-start;cursor:pointer;list-style:none}
.xc>summary::-webkit-details-marker{display:none}
.xc .side{flex:none;display:flex;flex-direction:column;align-items:flex-end;gap:6px}.xc ul{margin-top:14px}
.xc .tg:before{content:"Show description ▾";font-size:13px}.xc[open] .tg:before{content:"Hide description ▴"}
.g2{display:grid;grid-template-columns:repeat(auto-fit,minmax(330px,1fr));gap:16px}.g2 .card h3{margin-bottom:6px}.g2 ul{font-size:15px}
@media(max-width:700px){.xc>summary,.xh{flex-direction:column;gap:8px}.xc .side{align-items:flex-start}}
.ab{display:grid;grid-template-columns:280px 1fr;gap:40px;align-items:start}.ab img{width:100%;aspect-ratio:4/5;object-fit:cover;object-position:60% 30%;border-radius:20px}@media(max-width:700px){.ab{grid-template-columns:1fr}.ab img{aspect-ratio:1;max-width:320px}}#tb{display:none}#lg{position:fixed;inset:0;background:#000a;display:none;z-index:11;align-items:center;justify-content:center;padding:20px}#lg.s{display:flex}#lf{background:var(--bg);color:var(--fg);border-radius:16px;padding:24px;width:min(380px,100%);display:grid;gap:12px}#ft a{color:inherit;opacity:.6}.ab-copy{max-width:66ch}.ab-copy p{font-size:17px;line-height:1.8;margin:0 0 1.15em}.ab-copy p:last-child{margin-bottom:0}</style></head><body>

<div id="tb"><button class="btn o" id="lo">Log out</button><button class="btn o" id="dt" style="display:none">Data</button><button class="btn" id="et">Edit</button></div>

sum:"Forward-thinking academic technology leader with a strong higher education foundation, specializing in scalable learning solutions that drive student success. Proven track record of aligning instructional technology with institutional goals, collaborating with stakeholders to enhance learning outcomes, and driving continuous academic improvement.",
about:"I’ve built my career around helping people get more from the tools they use to teach, learn, and work. I started in instructional design and higher education, where I saw how thoughtful technology can make a real difference in someone’s day. Since then, my work has grown to include leading teams, improving services, and finding practical ways to bring new tools like AI into the mix. I enjoy taking a complicated challenge, listening to the people closest to it, and working with them to make things clearer and easier. I’m based in Lexington, Kentucky, and I’m always curious about what we can make better next.",

values:[{t:"Do the Right Thing.",d:"I build relationships on honesty, transparency, and trust."},{t:"Keep It Practical.",d:"The best solution isn't necessarily the most complicated one. I focus on what works."},{t:"Make the Complex Simple.",d:"Technology should empower people—not overwhelm them. I translate complex challenges into clear, understandable solutions."},{t:"Own the Outcome.",d:"I take responsibility for my work and stand behind the solutions I provide."},{t:"People Matter.",d:"Successful technology starts with understanding the people who use it. I put people at the center of the solutions I develop."},{t:"Always Be Learning.",d:"Technology is constantly changing, and I believe in staying curious, adapting, and continually improving."}],
